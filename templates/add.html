<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Post</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Add a New Blog Post</h1>

    <!-- Form to create a new blog post -->
    <form action="{{ url_for('add') }}" method="POST">
        <label for="author">Author:</label><br>
        <input type="text" id="author" name="author" placeholder="Your name" value="{{ request.form.author }}" required><br><br>

        <label for="title">Title:</label><br>
        <input type="text" id="title" name="title" placeholder="Post title" value="{{ request.form.title }}" required><br><br>

        <label for="content">Content:</label><br>
        <textarea id="content" name="content" rows="6" placeholder="Write your post here..." required>{{ request.form.content }}</textarea><br><br>

        <button type="submit">Add Post</button>
    </form>

    <br>
    <a href="{{ url_for('index') }}">← Back to Home</a>
</body>
</html>
